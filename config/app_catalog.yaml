    provisioning: app_api
    approval: manager+owner
    risk_tier: high
    birthright: false
    cost: true
    owner: ai-platform-owner
    kb: [api-key-process]
    nuance:
      - "API key без restrictions = секрет, що дає білінг на весь проєкт. Обмежувати по API та (де можна) по IP/referrer."
      - "Квоти та ліміти — на рівні проєкту, а не людини: 'у колеги не закінчується' часто = різні проєкти/акаунти."

