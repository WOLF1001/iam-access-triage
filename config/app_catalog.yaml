# =============================================================================
# app_catalog.yaml — каталог застосунків / entitlement'ів.
# Це головний "не-LLM" артефакт: без нього бот не має права нічого мапити.
# LLM повертає лише сирі згадки ("клод", "табло"), мапінг на app — детермінований
# (алиаси, найдовший збіг). Немає збігу → unknown_app → NEED_INFO. Не вгадуємо.
#
# Поля:
#   sso:            okta | google | none          — де живе автентифікація
#   read_side:      механізм, звідки беремо сигнали (assignments / usage / status)
#   act_side:       механізм, яким (теоретично) виконується дія; у прототипі — mock
#   provisioning:   okta_group | scim | app_api | manual
#   approval:       none | manager | owner | manager+owner | security
#   risk_tier:      low | medium | high | critical
#   birthright:     true → видається всім активним співробітникам без апруву
#   cost:           true → платна ліцензія/usage → у ланцюг апруву додається бюджет-власник
#   least_privilege_role: роль за замовчуванням, якщо скоуп не вказано
#   nuance:         практичні граблі (з досвіду / доків), які впливають на рішення
#
# Власники — вигадані ролі (dataset знеособлений).
# =============================================================================
version: 1

apps:
  okta:
    name: Okta
    aliases: [okta, окта, окту, окті, окти]
    category: identity
    sso: okta
    read_side: "Okta API: /api/v1/users, /groups, /apps/{id}/users, System Log /api/v1/logs; Event Hooks (user.lifecycle.*, group.user_membership.*)"
    act_side: "Okta API (OAuth 2.0 service app, scoped okta.groups.manage) — лише membership у дозволених групах"
    provisioning: okta_group
    approval: none
    risk_tier: high
    birthright: true
    cost: false
    owner: iam-team
    kb: [okta-what-is, okta-self-service-reset]
    nuance:
      - "API-токен (SSWS) успадковує права адміна, що його створив, і живе від його імені. Для бота — OAuth service app з мінімальними scope + custom admin role на resource set лише з 'запитуваних' груп."
      - "Rate limits — per-endpoint і per-org; обов'язково читати X-Rate-Limit-Remaining / Reset, бекофф на 429."
      - "System Log — найкращий read-side сигнал для діагностики входу (outcome.reason, client.ipAddress, policy evaluation)."

  onepassword:
    name: 1Password
    aliases: [1password, 1pass, 1пасворд, ванпасворд, 1password-і]
    category: secrets
    sso: okta
    read_side: "1Password Events API (signinattempts, itemusages, auditevents); SCIM bridge для users/groups"
    act_side: "НІЯКИХ авто-дій над vault/items. Share vault / delete item — тільки людина."
    provisioning: scim
    approval: owner
    risk_tier: critical
    birthright: true
    cost: true
    owner: iam-team
    kb: [onepassword-start]
    nuance:
      - "Events API дає item usage — це єдиний usage-сигнал для non-SSO shared-кредів (хто відкривав item), але не доводить, що людина реально логінилась у сервіс."
      - "Видалення item ≠ відкликання секрету. При компрометації: revoke у провайдера → новий секрет → оновити item → розслідування по itemusages."
      - "Service accounts мають обмеження на типи vault'ів і зміну доступів після створення — перевірити актуальні доки перед дизайном act-side."

  google_workspace:
    name: Google Workspace
    aliases: [google workspace, gws, корп пошт, корпоративн пошт, пошту, пошта, гугл драйв, драйв, gmail]
    category: productivity
    sso: okta
    read_side: "Admin SDK Directory API (users, groups), Reports API (login, token — видно сторонні OAuth-апки = shadow SaaS)"
    act_side: "Directory API через service account з domain-wide delegation (мінімальні scopes)"
    provisioning: scim
    approval: manager
    risk_tier: high
    birthright: true
    cost: true
    owner: it-helpdesk
    kb: [gws-2fa]
    nuance:
      - "Domain-wide delegation — фактично impersonation будь-кого в домені в межах scope. Scopes мінімальні, ключ SA — у секрет-менеджері, ротація."
      - "Reports API має затримку (години) — не годиться для real-time рішень, тільки для аудиту/діагностики."

  slack:
    name: Slack
    aliases: [slack, слак, слаці, слаку]
    category: communication
    sso: okta
    read_side: "Slack SCIM API (Business+/Enterprise), users.info (is_restricted, is_stranger для Slack Connect)"
    act_side: "SCIM / admin.* API (Enterprise Grid)"
    provisioning: scim
    approval: none
    risk_tier: medium
    birthright: true
    cost: true
    owner: it-helpdesk
    kb: [slack-login]
    nuance:
      - "Повідомлення боту можуть прийти від Slack Connect (зовнішніх) користувачів — requester треба верифікувати по team_id/is_stranger, а не по display name."

  vpn:
    name: Corporate VPN
    aliases: [vpn, впн]
    category: network
    sso: okta
    read_side: "Okta group membership 'vpn-users'"
    act_side: "Okta: add user to group 'vpn-users' (birthright)"
    provisioning: okta_group
    approval: none
    risk_tier: low
    birthright: true
    cost: false
    owner: it-infra
    okta_group: vpn-users
    kb: [vpn-connect]

  claude_org:
    name: Claude (organization, Team/Enterprise)
    aliases: [клод, клоді, клода, claude, клод-код, claude code, клауд]
    category: ai_tool
    sso: okta
    read_side: "Claude admin console / Admin API (members, seats, usage) — read-only"
    act_side: "Admin API / SCIM (Enterprise); зміна seat-типу, extra usage — через бюджет-власника"
    provisioning: scim
    approval: manager
    risk_tier: medium
    birthright: false
    cost: true
    owner: ai-platform-owner
    least_privilege_role: standard_seat
    kb: [claude-org-permissions, claude-connectors-policy]
    nuance:
      - "Seat-апгрейди та extra usage — це гроші, не доступ: апрув бюджет-власника, а не лише менеджера."
      - "Конектори/MCP — окремий security-review: токени конекторів дають моделі доступ до даних сторонніх систем."

  anthropic_api:
    name: Anthropic API (Console)
    aliases: [claude api, anthropic api, anthropic console, клод апі]
    category: ai_api
    sso: google
    read_side: "Anthropic Admin API (workspaces, api keys metadata, usage/cost)"
    act_side: "Ключ створюється в окремому workspace команди з spend limit; видача ключа — через 1Password item, не в Slack"
    provisioning: app_api
    approval: manager+owner
    risk_tier: high
    birthright: false
    cost: true
    owner: ai-platform-owner
    kb: [api-key-process]
    nuance:
      - "Ключ ніколи не пишеться в Slack/тікет. Тільки 1Password item у vault команди."

  gemini_api:
